name: BandStudio release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bandstudio-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      BANDSTUDIO_BROWSER: chromium
      BANDSTUDIO_TEST_ENGINE: ${{ github.workspace }}/dist/bandstudio/stage/BandStudio/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install uv pytest playwright==1.64.1 numpy==1.26.4 scipy==1.13.1 soundfile==0.13.1 reportlab==4.4.10 qrcode[pil]==8.2
      - run: python -m playwright install chromium
      - run: python tools/package_studio_windows.py
      - name: Verify mixer, preparation, updater and diagnostics
        shell: pwsh
        run: |
          # Without this, PowerShell only reports the exit code of the last pytest line.
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pytest -q tests/test_studio_progress.py
          python -m pytest -q tests/test_studio_artwork.py tests/test_studio_windows.py tests/test_studio_windows_startup.py tests/test_studio_compute.py tests/test_studio_services.py tests/test_studio_preparation.py tests/test_studio_support.py
          python -m pytest -q tests/test_studio_stable_metronome.py tests/test_studio_extra_chord_sources.py tests/test_studio_library_rename.py
          python -m pytest -q tests/test_studio_queue.py
          python -m pytest -q tests/test_studio_analysis_cache.py tests/test_studio_grid_calibration.py tests/test_studio_grid_pdf.py tests/test_studio_musical_timing.py tests/test_studio_section_grid.py
      - name: Verify portable correction and protected cues
        run: python -m pytest -q tests/test_cue_corrector_release.py tests/test_cue_corrector_training.py tests/test_cue_corrector_portable.py tests/test_studio_cue_scheduling.py tests/test_studio_reanalysis.py tests/test_studio_structure_grouping.py tests/test_studio_tempo_consistency.py tests/test_studio_tempo_units.py
      - name: Verify rhythm, chord discovery, structure review and export on Windows
        run: python -m pytest -q tests/test_studio_rhythm_decoder.py tests/test_studio_web_chords.py tests/test_studio_chord_providers.py tests/test_studio_chord_discovery.py tests/test_studio_structure_review.py tests/test_studio_structure_sources.py tests/test_studio_first_import.py tests/test_studio_song_memory.py tests/test_studio_manual_editor.py tests/test_studio_song_sheet.py tests/test_studio_workspace.py --junitxml=dist/checks/music-regressions.xml
      - name: Verify complete preparation, lyrics, guide mixing and graphical comparison
        run: python -m pytest -q tests/test_studio_complete_preparation.py tests/test_studio_automatic_benchmark.py tests/test_studio_lyrics_reference.py tests/test_studio_lyrics_search.py tests/test_studio_lyrics_alignment.py tests/test_studio_section_grid.py tests/test_studio_guide_mix.py tests/test_studio_section_evidence.py tests/test_studio_section_functions.py tests/test_studio_structure_comparison.py tests/test_studio_publication.py --junitxml=dist/checks/complete-preparation.xml
      - name: Reproduce and repair analysis dependency failure
        run: python tools/check_studio_analysis.py --report dist/checks
      - run: python tools/check_studio_windows.py dist/bandstudio/BandStudio-1.1.0-Windows-x64.zip --report dist/checks
      - run: python tools/package_studio_update.py --platform windows-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bandstudio-windows
          path: |
            dist/bandstudio/*.zip*
            dist/updates/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-diagnostics
          path: dist/checks
          if-no-files-found: ignore
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy==1.26.4 scipy==1.13.1 soundfile==0.13.1
      - name: Verify portable correction and protected cues
        run: python -m pytest -q tests/test_cue_corrector_release.py tests/test_cue_corrector_training.py tests/test_cue_corrector_portable.py tests/test_studio_cue_scheduling.py tests/test_studio_reanalysis.py
      - name: Verify automatic preparation and musical protection on both Mac architectures
        run: python -m pytest -q tests/test_studio_complete_preparation.py tests/test_studio_automatic_benchmark.py tests/test_studio_lyrics_reference.py tests/test_studio_lyrics_search.py tests/test_studio_lyrics_alignment.py tests/test_studio_section_grid.py tests/test_studio_section_evidence.py tests/test_studio_section_functions.py
      - run: python tools/build_studio_mac.py
      - name: Verify native clock against recorded rhythm fixtures
        run: python tools/check_studio_timing.py desktop-build/standalone/BandStudio.app/Contents/MacOS/BandStudio
      - name: Test native document and offline audio
        run: desktop-build/standalone/BandStudio.app/Contents/MacOS/BandStudio --self-test "$RUNNER_TEMP/BandStudio-test"
      - run: python tools/package_studio_update.py --platform ${{ matrix.platform }} --app desktop-build/standalone/BandStudio.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bandstudio-${{ matrix.platform }}
          path: dist/updates/*
  interface:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BANDSTUDIO_BROWSER: ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Official browsers and OS dependencies are already included: no APT mirror dependency.
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install pytest playwright==1.64.1 numpy scipy soundfile imageio-ffmpeg==0.6.0
      - name: Prepare audio worker for interface and export tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import imageio_ffmpeg
          import shutil
          import sys
          engine = Path('desktop-build/standalone/Engine')
          shutil.copytree('desktop/studio', engine, ignore=shutil.ignore_patterns('__pycache__', '*.swift'), dirs_exist_ok=True)
          python = engine / '.venv/bin/python'
          python.parent.mkdir(parents=True, exist_ok=True)
          python.symlink_to(sys.executable)
          target = engine / 'import-tools'
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), target / 'ffmpeg')
          PY
      - run: python -m pytest -q tests/test_standalone_studio.py tests/test_studio_support.py tests/test_studio_queue.py tests/test_studio_manual_editor.py tests/test_studio_song_sheet.py tests/test_studio_workspace.py tests/test_studio_progress.py tests/test_studio_web_chords.py tests/test_studio_chord_providers.py tests/test_studio_structure_review.py tests/test_studio_structure_sources.py tests/test_studio_song_memory.py
      - name: Verify comparison and bilingual public tutorials
        run: python -m pytest -q tests/test_studio_structure_comparison.py tests/test_studio_publication.py
      - name: Verify song renaming in both browser engines
        run: python -m pytest -q tests/test_studio_library_rename.py
  publish:
    needs: [windows, mac, interface]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: bandstudio-*
          path: release-assets
      - run: python tools/publish_studio_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
  report-failure:
    needs: [windows, mac, interface, publish]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open one issue for this failed build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[CI] BandStudio build $RUN_ID failed"
          count=$(gh issue list --state all --search "$title in:title" --json number --jq length)
          if [ "$count" = 0 ]; then
            printf 'Une vérification de publication a échoué. Aucune nouvelle mise à jour automatique ne sera proposée.\n\nDétails : %s\n' "$RUN_URL" > "$RUNNER_TEMP/bug.md"
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/bug.md"
          fi
